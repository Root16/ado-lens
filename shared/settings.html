<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>ADO Lens settings</title>
    <style>
      :root { color-scheme: light dark; }
      * { box-sizing: border-box; }
      body {
        width: 300px;
        min-height: 150px;
        margin: 0;
        background: Canvas;
        color: CanvasText;
        font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main { padding: 16px; }
      header { display: flex; align-items: center; gap: 9px; margin-bottom: 15px; }
      .mark {
        display: grid;
        place-items: center;
        width: 28px;
        height: 28px;
        border-radius: 7px;
        background: #0078d4;
        color: white;
        font-size: 11px;
        font-weight: 800;
      }
      h1 { margin: 0; font-size: 15px; }
      .setting {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        padding: 12px;
        border: 1px solid color-mix(in srgb, CanvasText 18%, transparent);
        border-radius: 8px;
        cursor: pointer;
      }
      .label { font-weight: 600; }
      .help { margin-top: 2px; color: GrayText; font-size: 11px; }
      input { width: 18px; height: 18px; flex: 0 0 auto; accent-color: #0078d4; }
      #status { min-height: 17px; margin: 9px 2px 0; color: GrayText; font-size: 11px; }
    </style>
  </head>
  <body>
    <main>
      <header><span class="mark">PR</span><h1>ADO Lens settings</h1></header>
      <label class="setting">
        <span><span class="label">Show floating stats</span><span class="help">Tab-row stats always remain visible.</span></span>
        <input id="show-floating-stats" type="checkbox">
      </label>
      <div id="status" role="status" aria-live="polite"></div>
    </main>
    <script src="settings.js"></script>
  </body>
</html>
